services:
  - type: web
    name: tonysiu-dev
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: tonysiu-chatbot-api
    runtime: python
    plan: starter
    rootDir: chatbot-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_USERNAME
        value: Tony363
      - key: ALLOWED_ORIGIN
        value: https://tonysiu-dev.onrender.com
      - key: MAX_REQUESTS_PER_MINUTE
        value: "10"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.12"
