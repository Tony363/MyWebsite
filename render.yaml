services:
  - type: web
    name: tonysiu-dev
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: chatbot-api
    runtime: python
    plan: starter
    rootDir: chatbot-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGEAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_USERNAME
        value: Tony363
      - key: DATABASE_URL
        fromDatabase:
          name: chatbot-db
          property: connectionString
      - key: ALLOWED_ORIGIN
        value: https://tonysiu.dev
      - key: MAX_REQUESTS_PER_MINUTE
        value: "10"
      - key: RETRIEVAL_TOP_K
        value: "8"
      - key: SIMILARITY_THRESHOLD
        value: "0.3"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.12"

  - type: cron
    name: github-indexer
    runtime: python
    plan: starter
    rootDir: chatbot-api
    schedule: "0 4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m indexer.main
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGEAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_USERNAME
        value: Tony363
      - key: DATABASE_URL
        fromDatabase:
          name: chatbot-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"

databases:
  - name: chatbot-db
    plan: starter
    databaseName: chatbot
    postgresMajorVersion: "16"
    ipAllowList: []
