<!-- Shared Header -->
<header>
    <a href="/" class="logo"><i class="fab fa-node-js" aria-hidden="true"></i> Tony</a>
    <nav id="primary-navigation" class="navbar">
        <ul>
            <li><a class="active" href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#education">Education</a></li>
            <li><a href="#work">Work</a></li>
            <li><a href="#experience">Experience</a></li>
            <li><a href="/press/">Press</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
    <div class="press-badges">
        <a href="/press/#article-techtimes-2026" class="press-badge" aria-label="Press Coverage in Tech Times">
            <span class="press-badge__icon">
                <img src="/assets/images/press/techtimes-logo.svg" alt="" width="20" height="20">
            </span>
            <span class="press-badge__text">
                <span class="press-badge__label">Press Coverage</span>
                <span class="press-badge__source">Tech Times</span>
            </span>
            <i class="fas fa-external-link-alt press-badge__arrow" aria-hidden="true"></i>
        </a>
        <a href="/press/#article-ibt-2026" class="press-badge" aria-label="Featured in International Business Times">
            <span class="press-badge__icon">
                <img src="/assets/images/press/ibt-logo.svg" alt="" width="20" height="20">
            </span>
            <span class="press-badge__text">
                <span class="press-badge__label">Global AI Recognition</span>
                <span class="press-badge__source">As Seen in IBT</span>
            </span>
            <i class="fas fa-external-link-alt press-badge__arrow" aria-hidden="true"></i>
        </a>
        <a href="/press/#article-technically-2026" class="press-badge" aria-label="Featured in Technical.ly">
            <span class="press-badge__icon">
                <img src="/assets/images/press/technically-logo.svg" alt="" width="20" height="20">
            </span>
            <span class="press-badge__text">
                <span class="press-badge__label">Community Spotlight</span>
                <span class="press-badge__source">Technical.ly</span>
            </span>
            <i class="fas fa-external-link-alt press-badge__arrow" aria-hidden="true"></i>
        </a>
    </div>
    <div class="header-actions">
        <button class="schedule-cta" type="button" onclick="loadCalendly()" aria-label="Schedule a call">
            <i class="fas fa-calendar-alt" aria-hidden="true"></i>
            <span class="cta-text">Schedule Call</span>
        </button>
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" data-theme-mode="light">
            <span class="icon icon-sun fas fa-sun" aria-hidden="true"></span>
            <span class="icon icon-moon fas fa-moon" aria-hidden="true"></span>
        </button>
        <button id="menu" class="fas fa-bars" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Toggle navigation menu"></button>
    </div>
</header>
